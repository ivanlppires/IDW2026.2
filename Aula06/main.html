<!DOCTYPE html>
<html lang='pt-br'>
<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <title>Cores em CSS</title>
    <link rel='stylesheet' href='seletores.css'>
</head>
<body>
    <h1 id="titulo">AULA 06</h1>
    <p>Estudando seletores em CSS</p>
    <p class="card">Sou um outro parágrafo</p>
    <p>Eu também sou um parágrafo</p>
    <div>Sou um bloco</div>

    <div class="card">Eu sou outro cartão</div>
    <div class="card">Sou o terceiro cartão</div>

    <div class="card">
        <h1 class="subtitulo">Título do cartão</h1>
        <p>Sou um parágrafo dentro do cartão</p>
        <p>Sou outro paragrafo</p>
        <div>
            <button>Salvar</button>
            <button>Cancelar</button>
        </div>
    </div>

</body>
