<!DOCTYPE html>
<html lang='pt-br'>

<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <title>INTRODUÇÃO A LAYOUT COM CSS</title>
    <link rel='stylesheet' href='main.css'>
    <link rel='stylesheet' href='form.css'>
</head>

<body>
    <header>
        <img src="imagens/logo.png" alt="Logo da empresa" />
        <section>
            <button type="button" aria-label="Usuário">👤 Login</button>
        </section>
    </header>
    <nav>
        <a href="index.html">Início</a>
        <a href="produtos.html">Produtos</a>
        <a href="sobre.html">Sobre</a>
        <a href="contato.html">Contato</a>
    </nav>
    <main aria-label="conteúdo principal">
        <section>
            <h1>Entre em contato</h1>
            <form action="#" method="post">
                <p>
                    <label for="nome">Nome:</label><br>
                    <input type="text" id="nome" name="nome" required>
                </p>
                <p>
                    <label for="email">E-mail:</label><br>
                    <input type="email" id="email" name="email" required>
                </p>
                <p>
                    <label for="mensagem">Mensagem:</label><br>
                    <textarea id="mensagem" name="mensagem" rows="5" required></textarea>
                </p>
                <button type="submit">Enviar mensagem</button>
            </form>
            <p>WhatsApp: <a href="https://wa.me/5565999999999">(65) 99999-9999</a></p>
        </section>
    </main>
    <footer>
        <p>&copy; 2026 Minha Empresa. Todos os direitos reservados.</p>
        <p>Desenvolvido com ❤️ por mim.</p>
        <p>Contato: contato@minhaempresa.com</p>
    </footer>
</body>

</html>
